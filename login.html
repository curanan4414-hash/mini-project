<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ - Payroll System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Prompt', sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center px-4">

  <div class="w-full max-w-sm bg-white p-8 rounded-2xl border border-slate-200 shadow-sm space-y-6">
    <div class="text-center">
      <h1 class="text-2xl font-bold text-indigo-600">💼 Payroll System</h1>
      <p class="text-sm text-slate-500 mt-1">กรุณาเข้าสู่ระบบเพื่อใช้งาน</p>
    </div>

    <form id="login-form" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">ชื่อผู้ใช้</label>
        <input type="text" id="username" required autofocus placeholder="เช่น admin" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 text-sm focus:outline-none">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">รหัสผ่าน</label>
        <input type="password" id="password" required placeholder="รหัสผ่าน" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 text-sm focus:outline-none">
      </div>

      <p id="error-msg" class="text-sm text-rose-600 hidden">ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง</p>

      <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg text-sm shadow transition">
        เข้าสู่ระบบ
      </button>
    </form>

    <p class="text-xs text-slate-400 text-center">สำหรับทดสอบ: admin / admin123</p>
  </div>

  <script src="app.js"></script>
  <script>
    // ถ้าล็อกอินอยู่แล้ว ไม่ต้องเข้าหน้านี้อีก
    if (authService.isLoggedIn()) {
      window.location.replace("index.html");
    }

    document.getElementById("login-form").addEventListener("submit", function(e) {
      e.preventDefault();
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      if (authService.login(username, password)) {
        window.location.href = "index.html";
      } else {
        document.getElementById("error-msg").classList.remove("hidden");
        document.getElementById("password").value = "";
      }
    });
  </script>
</body>
</html>
